<title>Ritmo</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0f0f13;color:#e2e8f0;font-family:'Inter',-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;}
  input[type=range]{width:100%;}
  textarea,input{font-family:inherit;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const BLOCKS = ["Mañana","Tarde","Noche"];
const DAYS = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const defaultActivities = [{id:1,name:"Ejercicio",block:"Mañana",freq:5},{id:2,name:"Leer",block:"Noche",freq:7},{id:3,name:"Meditar",block:"Mañana",freq:3}];
const DEFAULT_GOALS = {cals:2000,protein:150,carbs:250,fat:65};
const THEMES = [
  {name:"Morado",main:"#a78bfa",dark:"#7c3aed"},{name:"Azul",main:"#3b82f6",dark:"#1d4ed8"},
  {name:"Cian",main:"#06b6d4",dark:"#0e7490"},{name:"Verde",main:"#22c55e",dark:"#15803d"},
  {name:"Lima",main:"#84cc16",dark:"#4d7c0f"},{name:"Naranja",main:"#f97316",dark:"#c2410c"},
  {name:"Rojo",main:"#ef4444",dark:"#b91c1c"},{name:"Rosa",main:"#ec4899",dark:"#be185d"},
  {name:"Fucsia",main:"#f43f5e",dark:"#be123c"},{name:"Índigo",main:"#6366f1",dark:"#4338ca"},
];
const BLOCK_COLORS = ["#f59e0b","#6366f1","#8b5cf6"];

// --- FIX zona horaria: usar SIEMPRE fecha local, nunca UTC ---
function fmtKey(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
function parseKey(key){
  const [y,m,d]=key.split("-").map(Number);
  return new Date(y,m-1,d);
}
function getTodayKey(){return fmtKey(new Date());}
function getWeekKey(){const d=new Date(),day=d.getDay()||7,mon=new Date(d);mon.setDate(d.getDate()-day+1);return fmtKey(mon);}

function NutriBar({val,max,color,label,unit="g"}){
  const pct=Math.min(100,Math.round((val/max)*100));
  return(<div style={{marginBottom:10}}>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
      <span style={{fontSize:12,color:"#94a3b8"}}>{label}</span>
      <span style={{fontSize:12,fontWeight:600,color}}>{Math.round(val)}{unit} <span style={{color:"#475569",fontWeight:400}}>/ {max}{unit}</span></span>
    </div>
    <div style={{height:6,background:"#2a2a35",borderRadius:99}}><div style={{height:"100%",borderRadius:99,background:color,width:pct+"%",transition:"width 0.4s"}}/></div>
  </div>);
}
function FlameIcon({streak}){
  if(streak===0)return(<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="9" stroke="#475569" strokeWidth="1.5"/><circle cx="11" cy="11" r="3" fill="#475569" opacity="0.4"/></svg>);
  if(streak<3)return(<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 3C11 3 14 7 14 10C14 11.5 13.2 12.8 12 13.5C12.3 12.5 12 11.5 11 11C11 11 9 13 9 15C9 16.7 10 18 11 18.5C8.5 18 6 15.8 6 13C6 9 9 6 11 3Z" fill="#94a3b8" opacity="0.7"/><path d="M11 13C11 13 12.5 14.5 12.5 16C12.5 17.4 11.8 18.5 11 19C10.2 18.5 9.5 17.4 9.5 16C9.5 14.5 11 13 11 13Z" fill="#cbd5e1"/></svg>);
  if(streak<7)return(<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 2C11 2 15 7 15 10.5C15 12.2 14.1 13.7 12.8 14.5C13.1 13.3 12.7 12 11.5 11.2C11.5 11.2 9 13.5 9 15.5C9 17.3 10 18.8 11 19.3C8 18.6 5.5 16 5.5 13C5.5 8.5 9 5 11 2Z" fill="#f59e0b"/><path d="M11 13C11 13 13 15 13 16.8C13 18.3 12.1 19.5 11 20C9.9 19.5 9 18.3 9 16.8C9 15 11 13 11 13Z" fill="#fcd34d"/></svg>);
  return(<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 1C11 1 16 7 16 11C16 13 15 14.8 13.5 15.8C14 14.3 13.4 12.5 12 11.5C12 11.5 9 14 9 16.5C9 18.5 10.2 20 11 20.5C7.5 19.5 5 16.8 5 13C5 8 9 4.5 11 1Z" fill="#f97316"/><path d="M11 13C11 13 13 15.3 13 17.3C13 19 12 20.3 11 21C10 20.3 9 19 9 17.3C9 15.3 11 13 11 13Z" fill="#fcd34d"/><circle cx="8" cy="10" r="1" fill="#fb923c" opacity="0.5"/></svg>);
}
function EditIcon(){return(<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M11 2.5L13.5 5L5.5 13H3V10.5L11 2.5Z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/><path d="M9.5 4L12 6.5" stroke="currentColor" strokeWidth="1.3"/></svg>);}
function TrashIcon(){return(<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 5H13" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/><path d="M6 5V3.5C6 3.2 6.2 3 6.5 3H9.5C9.8 3 10 3.2 10 3.5V5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/><path d="M5 5L5.5 12.5C5.5 12.8 5.7 13 6 13H10C10.3 13 10.5 12.8 10.5 12.5L11 5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/><path d="M8 7V11M6.5 7L6.7 11M9.5 7L9.3 11" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>);}

function App(){
  const [activities,setActivities]=useState(function(){try{return JSON.parse(localStorage.getItem("dta_acts")||"null")||defaultActivities;}catch(e){return defaultActivities;}});
  const [checks,setChecks]=useState(function(){try{return JSON.parse(localStorage.getItem("dta_checks")||"{}");}catch(e){return {};}});
  const [meals,setMeals]=useState(function(){try{return JSON.parse(localStorage.getItem("dta_meals")||"{}");}catch(e){return {};}});
  const [goals,setGoals]=useState(function(){try{return JSON.parse(localStorage.getItem("dta_goals")||"null")||DEFAULT_GOALS;}catch(e){return DEFAULT_GOALS;}});
  const [themeIdx,setThemeIdx]=useState(function(){try{return parseInt(localStorage.getItem("dta_theme")||"0");}catch(e){return 0;}});
  const theme=THEMES[themeIdx];
  const C=theme.main,CD=theme.dark;
  const [view,setView]=useState("day");
  const [nutriTab,setNutriTab]=useState("today");
  const [form,setForm]=useState({name:"",block:"Mañana",freq:5});
  const [editId,setEditId]=useState(null);
  const [monthOffset,setMonthOffset]=useState(0);
  const [analyzing,setAnalyzing]=useState(false);
  const [analyzeError,setAnalyzeError]=useState("");
  const [photoNote,setPhotoNote]=useState("");
  const [pendingFile,setPendingFile]=useState(null);
  const [pendingPreview,setPendingPreview]=useState(null);
  const [goalsForm,setGoalsForm]=useState(function(){return Object.assign({},DEFAULT_GOALS);});
  const [textMeal,setTextMeal]=useState("");
  const [analyzingText,setAnalyzingText]=useState(false);
  const fileRef=useRef();

  // --- auto-refresca la app cuando cambia el día local (para que a medianoche real se vea el nuevo día sin recargar a mano) ---
  const [todayKey,setTodayKey]=useState(getTodayKey());
  useEffect(function(){
    const timer=setInterval(function(){
      const k=getTodayKey();
      setTodayKey(function(prev){return prev!==k?k:prev;});
    },30000);
    return function(){clearInterval(timer);};
  },[]);
  const weekKey=getWeekKey();

  useEffect(function(){localStorage.setItem("dta_acts",JSON.stringify(activities));},[activities]);
  useEffect(function(){localStorage.setItem("dta_checks",JSON.stringify(checks));},[checks]);
  useEffect(function(){localStorage.setItem("dta_meals",JSON.stringify(meals));},[meals]);
  useEffect(function(){localStorage.setItem("dta_goals",JSON.stringify(goals));},[goals]);
  useEffect(function(){localStorage.setItem("dta_theme",String(themeIdx));},[themeIdx]);

  const todayChecks=checks[todayKey]||{};
  const toggle=function(id){setChecks(function(prev){const day=Object.assign({},prev[todayKey]||{});day[id]=!day[id];return Object.assign({},prev,{[todayKey]:day});});};
  const dayRating=activities.length?Math.round((Object.values(todayChecks).filter(Boolean).length/activities.length)*100):0;
  const weekDays=Array.from({length:7},function(_,i){const d=parseKey(weekKey);d.setDate(d.getDate()+i);return fmtKey(d);});
  const weekCount=function(actId){return weekDays.filter(function(d){return !!(checks[d]||{})[actId];}).length;};
  const streak=(function(){let count=0;const d=new Date();d.setDate(d.getDate()-1);while(true){const k=fmtKey(d);const dc=checks[k]||{};const pct=activities.length?Math.round((Object.values(dc).filter(Boolean).length/activities.length)*100):0;if(pct>=80){count++;d.setDate(d.getDate()-1);}else break;}if(dayRating>=80)count++;return count;})();

  const saveActivity=function(){if(!form.name.trim())return;if(editId!==null){setActivities(function(prev){return prev.map(function(a){return a.id===editId?Object.assign({},a,form):a;});});setEditId(null);}else setActivities(function(prev){return[...prev,Object.assign({id:Date.now()},form)];});setForm({name:"",block:"Mañana",freq:5});setView("day");};
  const deleteAct=function(id){setActivities(function(prev){return prev.filter(function(a){return a.id!==id;});});};
  const startEdit=function(a){setForm({name:a.name,block:a.block,freq:a.freq});setEditId(a.id);setView("add");};
  const todayMeals=meals[todayKey]||[];
  const totals=todayMeals.reduce(function(acc,m){return{cals:acc.cals+m.cals,protein:acc.protein+m.protein,carbs:acc.carbs+m.carbs,fat:acc.fat+m.fat};},{cals:0,protein:0,carbs:0,fat:0});
  const onFileChange=function(e){const file=e.target.files[0];if(!file)return;setPendingFile(file);setPendingPreview(URL.createObjectURL(file));e.target.value="";};

  // --- FIX IA: llamar al proxy propio en Vercel, nunca directo a Anthropic desde el navegador ---
  const callAI=async function(messages){
    const resp=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:messages})});
    const data=await resp.json();
    if(!resp.ok||data.error){throw new Error(data.error||"Error del servidor");}
    return data.content.map(function(i){return i.text||"";}).join("").replace(/```json|```/g,"").trim();
  };

  const analyzePhoto=async function(){
    if(!pendingFile)return;setAnalyzing(true);setAnalyzeError("");
    try{
      const base64=await new Promise(function(res,rej){const r=new FileReader();r.onload=function(){res(r.result.split(",")[1]);};r.onerror=rej;r.readAsDataURL(pendingFile);});
      const ctx=photoNote.trim()?"\nContexto: \""+photoNote.trim()+"\"":"";
      const text=await callAI([{role:"user",content:[{type:"image",source:{type:"base64",media_type:pendingFile.type||"image/jpeg",data:base64}},{type:"text",text:"Analiza esta comida y responde SOLO con JSON valido sin markdown."+ctx+"\nFormato: {\"name\":\"nombre\",\"cals\":num,\"protein\":num,\"carbs\":num,\"fat\":num,\"notes\":\"descripcion breve\"}"}]}]);
      const parsed=JSON.parse(text);
      const meal=Object.assign({id:Date.now()},parsed,{time:new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})});
      setMeals(function(prev){return Object.assign({},prev,{[todayKey]:[...(prev[todayKey]||[]),meal]});});
      setPendingFile(null);setPendingPreview(null);setPhotoNote("");
    }catch(e){setAnalyzeError("No se pudo analizar. Intenta de nuevo.");}
    setAnalyzing(false);
  };

  const analyzeText=async function(){
    if(!textMeal.trim())return;setAnalyzingText(true);setAnalyzeError("");
    try{
      const text=await callAI([{role:"user",content:"Analiza esta comida descrita por texto y responde SOLO con JSON valido sin markdown.\nComida: \""+textMeal.trim()+"\"\nFormato: {\"name\":\"nombre\",\"cals\":num,\"protein\":num,\"carbs\":num,\"fat\":num,\"notes\":\"descripcion breve\"}"}]);
      const parsed=JSON.parse(text);
      const meal=Object.assign({id:Date.now()},parsed,{time:new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})});
      setMeals(function(prev){return Object.assign({},prev,{[todayKey]:[...(prev[todayKey]||[]),meal]});});
      setTextMeal("");
    }catch(e){setAnalyzeError("No se pudo analizar. Intenta de nuevo.");}
    setAnalyzingText(false);
  };

  const deleteMeal=function(id){setMeals(function(prev){return Object.assign({},prev,{[todayKey]:(prev[todayKey]||[]).filter(function(x){return x.id!==id;})});});};
  const saveGoals=function(){setGoals(Object.assign({},goalsForm));setView("nutri");};
  const ratingColor=dayRating>=80?"#22c55e":dayRating>=50?"#f59e0b":"#ef4444";
  const todayLabel=new Date().toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
  const blockColor=function(block){return BLOCK_COLORS[BLOCKS.indexOf(block)]||C;};
  const monthDate=new Date();monthDate.setDate(1);monthDate.setMonth(monthDate.getMonth()+monthOffset);
  const monthYear=monthDate.toLocaleDateString("es-MX",{month:"long",year:"numeric"});
  const firstDayOfWeek=(monthDate.getDay()+6)%7;
  const daysInMonth=new Date(monthDate.getFullYear(),monthDate.getMonth()+1,0).getDate();
  const getMonthDayKey=function(d){return fmtKey(new Date(monthDate.getFullYear(),monthDate.getMonth(),d));};
  const dayPct=function(d){const dc=checks[getMonthDayKey(d)]||{};return activities.length?Math.round((Object.values(dc).filter(Boolean).length/activities.length)*100):0;};
  const pctBgColor=function(pct){return pct===0?"#1c1c26":pct<40?"#3b1d1d":pct<70?"#3b2f0a":pct<100?"#1a3a1a":"#14532d";};
  const pctBorderColor=function(pct,isT){return isT?C:pct===100?"#22c55e":"transparent";};
  const last7=Array.from({length:7},function(_,i){const d=new Date();d.setDate(d.getDate()-(6-i));return fmtKey(d);});

  const safeTop = "calc(env(safe-area-inset-top, 44px) + 12px)";

  return(
    <div style={{minHeight:"100vh",background:"#0f0f13",color:"#e2e8f0",fontFamily:"'Inter',sans-serif",paddingBottom:80}}>
      <div style={{background:"#18181f",paddingTop:safeTop,paddingLeft:20,paddingRight:20,paddingBottom:0,borderBottom:"1px solid #2a2a35"}}>
        <div style={{maxWidth:480,margin:"0 auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div>
              <div style={{fontSize:20,fontWeight:700,color:"#fff"}}>Ritmo</div>
              <div style={{fontSize:12,color:"#64748b",textTransform:"capitalize"}}>{todayLabel}</div>
              <div style={{display:"flex",alignItems:"center",gap:5,marginTop:4}}>
                <FlameIcon streak={streak}/>
                <span style={{fontSize:13,fontWeight:700,color:streak>=7?"#f97316":streak>=3?"#f59e0b":"#94a3b8"}}>{streak} día{streak!==1?"s":""}</span>
                <span style={{fontSize:11,color:"#475569"}}>de racha</span>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{position:"relative",width:56,height:56}}>
                <svg width="56" height="56" style={{transform:"rotate(-90deg)"}}>
                  <circle cx="28" cy="28" r="22" fill="none" stroke="#2a2a35" strokeWidth="4"/>
                  <circle cx="28" cy="28" r="22" fill="none" stroke={ratingColor} strokeWidth="4" strokeDasharray={String(2*Math.PI*22)} strokeDashoffset={String(2*Math.PI*22*(1-dayRating/100))} strokeLinecap="round" style={{transition:"stroke-dashoffset 0.5s"}}/>
                </svg>
                <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <span style={{fontSize:12,fontWeight:700,color:ratingColor}}>{dayRating}%</span>
                </div>
              </div>
              <button onClick={function(){setGoalsForm(Object.assign({},goals));setView("settings");}} style={{background:"#1c1c26",border:"1px solid #2a2a35",borderRadius:10,padding:"8px 10px",cursor:"pointer",color:"#64748b",display:"flex",alignItems:"center"}}>
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 11.5A2.5 2.5 0 1 0 9 6.5a2.5 2.5 0 0 0 0 5z" stroke="currentColor" strokeWidth="1.3"/><path d="M14.5 9c0-.3 0-.6-.1-.9l1.4-1.1-1.5-2.6-1.7.7A5.5 5.5 0 0 0 11 4.4L10.7 2.5h-3L7.4 4.4c-.5.2-.9.5-1.3.8L4.4 4.5 2.9 7l1.4 1.1C4.2 8.4 4.1 8.7 4.1 9s0 .6.1.9L2.8 11l1.5 2.6 1.7-.7c.4.3.8.6 1.3.8l.3 1.8h3l.3-1.8c.5-.2.9-.5 1.3-.8l1.7.7 1.5-2.6-1.4-1.1c0-.3.1-.6.1-.9z" stroke="currentColor" strokeWidth="1.3"/></svg>
              </button>
            </div>
          </div>
          <div style={{display:"flex"}}>
            {[["day","Hoy"],["week","Semana"],["month","Mes"],["nutri","Nutrición"]].map(function(item){
              return(<button key={item[0]} onClick={function(){setView(item[0]);}} style={{flex:1,padding:"10px 0",border:"none",background:"none",cursor:"pointer",color:view===item[0]?C:"#64748b",fontWeight:view===item[0]?700:400,fontSize:12,borderBottom:view===item[0]?"2px solid "+C:"2px solid transparent",transition:"all 0.2s"}}>{item[1]}</button>);
            })}
          </div>
        </div>
      </div>

      <div style={{maxWidth:480,margin:"0 auto",padding:"20px 16px"}}>

        {view==="day"&&(<div>
          {BLOCKS.map(function(block){
            const acts=activities.filter(function(a){return a.block===block;});
            if(!acts.length)return null;
            const bc=blockColor(block);
            return(<div key={block} style={{marginBottom:24}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:bc}}/>
                <span style={{fontSize:13,fontWeight:600,color:bc,textTransform:"uppercase",letterSpacing:1}}>{block}</span>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {acts.map(function(a){
                  const done=!!todayChecks[a.id];
                  return(<div key={a.id} onClick={function(){toggle(a.id);}} style={{background:done?"#1e2a1e":"#1c1c26",border:"1px solid "+(done?"#22c55e44":"#2a2a35"),borderRadius:12,padding:"14px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:14,transition:"all 0.2s"}}>
                    <div style={{width:24,height:24,borderRadius:"50%",border:"2px solid "+(done?"#22c55e":"#3f3f55"),background:done?"#22c55e":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all 0.2s"}}>
                      {done&&<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#fff" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:15,fontWeight:500,color:done?"#64748b":"#e2e8f0",textDecoration:done?"line-through":"none"}}>{a.name}</div>
                      <div style={{fontSize:11,color:"#475569",marginTop:2}}>{weekCount(a.id)}/{a.freq}x esta semana</div>
                    </div>
                    <div style={{display:"flex",gap:6}} onClick={function(e){e.stopPropagation();}}>
                      <button onClick={function(){startEdit(a);}} style={{background:"none",border:"none",cursor:"pointer",color:"#475569",padding:4,display:"flex",alignItems:"center"}}><EditIcon/></button>
                      <button onClick={function(){deleteAct(a.id);}} style={{background:"none",border:"none",cursor:"pointer",color:"#475569",padding:4,display:"flex",alignItems:"center"}}><TrashIcon/></button>
                    </div>
                  </div>);
                })}
              </div>
            </div>);
          })}
          {activities.length===0&&<div style={{textAlign:"center",color:"#475569",marginTop:60}}><div style={{fontSize:40}}>📋</div><div style={{marginTop:12}}>No tienes actividades aún.</div></div>}
        </div>)}

        {view==="week"&&(<div>
          <div style={{background:"#18181f",borderRadius:14,padding:16,marginBottom:20,border:"1px solid #2a2a35"}}>
            <div style={{fontSize:13,color:"#64748b",marginBottom:12}}>Resumen de la semana</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,textAlign:"center"}}>
              {DAYS.map(function(d,i){
                const dk=weekDays[i],dc=checks[dk]||{};
                const pct=activities.length?Math.round((Object.values(dc).filter(Boolean).length/activities.length)*100):0;
                const isToday=dk===todayKey;
                return(<div key={d}>
                  <div style={{fontSize:10,color:isToday?C:"#475569",marginBottom:4,fontWeight:isToday?700:400}}>{d}</div>
                  <div style={{height:40,borderRadius:6,background:pct>0?C+"33":"#1c1c26",border:isToday?"1px solid "+C:"1px solid #2a2a35",display:"flex",alignItems:"center",justifyContent:"center"}}>
                    <span style={{fontSize:9,color:pct>0?C:"#3f3f55",fontWeight:600}}>{pct>0?pct+"%":"—"}</span>
                  </div>
                </div>);
              })}
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {activities.map(function(a){
              const wc=weekCount(a.id),pct=Math.min(100,Math.round((wc/a.freq)*100));
              const bc=blockColor(a.block);
              return(<div key={a.id} style={{background:"#1c1c26",borderRadius:12,padding:"14px 16px",border:"1px solid #2a2a35"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                  <div><span style={{fontSize:14,fontWeight:500}}>{a.name}</span><span style={{marginLeft:8,fontSize:11,color:bc,background:bc+"22",padding:"2px 7px",borderRadius:20}}>{a.block}</span></div>
                  <span style={{fontSize:13,fontWeight:600,color:pct>=100?"#22c55e":"#e2e8f0"}}>{wc}/{a.freq}</span>
                </div>
                <div style={{height:6,background:"#2a2a35",borderRadius:99}}><div style={{height:"100%",borderRadius:99,background:pct>=100?"#22c55e":C,width:pct+"%",transition:"width 0.4s"}}/></div>
              </div>);
            })}
          </div>
        </div>)}

        {view==="month"&&(<div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <button onClick={function(){setMonthOffset(function(o){return o-1;});}} style={{background:"#1c1c26",border:"1px solid #2a2a35",borderRadius:8,color:C,cursor:"pointer",padding:"6px 14px",fontSize:18}}>‹</button>
            <span style={{fontSize:15,fontWeight:600,color:"#e2e8f0",textTransform:"capitalize"}}>{monthYear}</span>
            <button onClick={function(){setMonthOffset(function(o){return o+1;});}} style={{background:"#1c1c26",border:"1px solid #2a2a35",borderRadius:8,color:C,cursor:"pointer",padding:"6px 14px",fontSize:18}}>›</button>
          </div>
          <div style={{background:"#18181f",borderRadius:16,padding:16,border:"1px solid #2a2a35"}}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:8}}>
              {["L","M","M","J","V","S","D"].map(function(d,i){return<div key={i} style={{textAlign:"center",fontSize:11,color:"#475569",fontWeight:600}}>{d}</div>;})}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
              {Array.from({length:firstDayOfWeek}).map(function(_,i){return<div key={"e"+i}/>;} )}
              {Array.from({length:daysInMonth},function(_,i){return i+1;}).map(function(d){
                const pct=dayPct(d),isT=getMonthDayKey(d)===todayKey;
                return(<div key={d} style={{aspectRatio:"1",borderRadius:8,background:pctBgColor(pct),border:"2px solid "+pctBorderColor(pct,isT),display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                  <span style={{fontSize:12,fontWeight:isT?700:400,color:isT?C:pct>0?"#e2e8f0":"#3f3f55"}}>{d}</span>
                  {pct>0&&<span style={{fontSize:8,color:pct===100?"#22c55e":"#94a3b8"}}>{pct}%</span>}
                </div>);
              })}
            </div>
          </div>
          <div style={{marginTop:20,background:"#18181f",borderRadius:14,padding:16,border:"1px solid #2a2a35"}}>
            <div style={{fontSize:13,color:"#64748b",marginBottom:12}}>Resumen del mes</div>
            {(function(){
              const dwd=Array.from({length:daysInMonth},function(_,i){return i+1;}).filter(function(d){return dayPct(d)>0;});
              const perf=dwd.filter(function(d){return dayPct(d)===100;}).length;
              const avg=dwd.length?Math.round(dwd.reduce(function(s,d){return s+dayPct(d);},0)/dwd.length):0;
              return(<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
                {[["Días registrados",dwd.length,C],["Días perfectos",perf,"#22c55e"],["Promedio",avg+"%","#f59e0b"]].map(function(item){
                  return(<div key={item[0]} style={{textAlign:"center",background:"#1c1c26",borderRadius:10,padding:"12px 8px"}}>
                    <div style={{fontSize:22,fontWeight:700,color:item[2]}}>{item[1]}</div>
                    <div style={{fontSize:10,color:"#64748b",marginTop:2}}>{item[0]}</div>
                  </div>);
                })}
              </div>);
            })()}
          </div>
        </div>)}

        {view==="nutri"&&(<div>
          <div style={{display:"flex",background:"#18181f",borderRadius:12,padding:4,marginBottom:16,border:"1px solid #2a2a35"}}>
            {[["today","Hoy"],["history","Historial"]].map(function(item){
              return(<button key={item[0]} onClick={function(){setNutriTab(item[0]);}} style={{flex:1,padding:"8px 0",borderRadius:9,border:"none",cursor:"pointer",fontSize:13,fontWeight:nutriTab===item[0]?600:400,background:nutriTab===item[0]?C+"33":"transparent",color:nutriTab===item[0]?C:"#64748b",transition:"all 0.2s"}}>{item[1]}</button>);
            })}
          </div>

          {nutriTab==="today"&&(<div>
            <div style={{background:"#18181f",borderRadius:16,padding:18,marginBottom:16,border:"1px solid #2a2a35"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <span style={{fontSize:14,fontWeight:600}}>Resumen de hoy</span>
                <span style={{fontSize:22,fontWeight:800,color:"#f59e0b"}}>{Math.round(totals.cals)} <span style={{fontSize:12,color:"#64748b",fontWeight:400}}>kcal</span></span>
              </div>
              <NutriBar val={totals.cals} max={goals.cals} color="#f59e0b" label="Calorias" unit=" kcal"/>
              <NutriBar val={totals.protein} max={goals.protein} color={C} label="Proteina"/>
              <NutriBar val={totals.carbs} max={goals.carbs} color="#22c55e" label="Carbohidratos"/>
              <NutriBar val={totals.fat} max={goals.fat} color="#f43f5e" label="Grasas"/>
            </div>

            {/* TEXT INPUT */}
            <div style={{background:"#1c1c26",borderRadius:16,padding:16,marginBottom:16,border:"1px solid #2a2a35"}}>
              <div style={{fontSize:13,fontWeight:600,color:C,marginBottom:10}}>✏️ Escribir lo que comí</div>
              <textarea value={textMeal} onChange={function(e){setTextMeal(e.target.value);}}
                placeholder="Ej: 2 tacos de birria con todo, un vaso de agua, media naranja..."
                style={{width:"100%",background:"#0f0f13",border:"1px solid #2a2a35",borderRadius:10,padding:"10px 12px",color:"#e2e8f0",fontSize:13,resize:"none",height:80,outline:"none",boxSizing:"border-box",marginBottom:10,fontFamily:"inherit"}}/>
              {analyzeError&&<div style={{color:"#f43f5e",fontSize:12,marginBottom:8}}>{analyzeError}</div>}
              <button onClick={analyzeText} disabled={analyzingText||!textMeal.trim()} style={{width:"100%",padding:"11px 0",borderRadius:10,border:"none",background:analyzingText||!textMeal.trim()?"#2a2a3f":"linear-gradient(135deg,"+CD+","+C+")",color:"#fff",cursor:analyzingText||!textMeal.trim()?"default":"pointer",fontSize:14,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                {analyzingText?"Analizando...":"Analizar con IA"}
              </button>
            </div>

            {/* PHOTO */}
            <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={onFileChange}/>
            {pendingPreview?(
              <div style={{background:"#1c1c26",borderRadius:16,padding:16,marginBottom:16,border:"1px solid #2a2a35"}}>
                <img src={pendingPreview} alt="preview" style={{width:"100%",borderRadius:10,maxHeight:200,objectFit:"cover",marginBottom:12}}/>
                <textarea value={photoNote} onChange={function(e){setPhotoNote(e.target.value);}} placeholder="Contexto extra (opcional): 'sin tortilla', 'porcion pequena'..." style={{width:"100%",background:"#0f0f13",border:"1px solid #2a2a35",borderRadius:10,padding:"10px 12px",color:"#e2e8f0",fontSize:13,resize:"none",height:60,outline:"none",boxSizing:"border-box",marginBottom:10,fontFamily:"inherit"}}/>
                {analyzeError&&<div style={{color:"#f43f5e",fontSize:12,marginBottom:8}}>{analyzeError}</div>}
                <div style={{display:"flex",gap:10}}>
                  <button onClick={function(){setPendingFile(null);setPendingPreview(null);setPhotoNote("");setAnalyzeError("");}} style={{flex:1,padding:"11px 0",borderRadius:10,border:"1px solid #2a2a35",background:"transparent",color:"#64748b",cursor:"pointer",fontSize:14}}>Cancelar</button>
                  <button onClick={analyzePhoto} disabled={analyzing} style={{flex:2,padding:"11px 0",borderRadius:10,border:"none",background:analyzing?"#2a2a3f":"linear-gradient(135deg,"+CD+","+C+")",color:"#fff",cursor:analyzing?"default":"pointer",fontSize:14,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                    {analyzing?"Analizando...":"Analizar con IA"}
                  </button>
                </div>
              </div>
            ):(
              <button onClick={function(){fileRef.current.click();}} style={{width:"100%",padding:16,borderRadius:14,border:"2px dashed "+C+"66",background:C+"11",color:C,cursor:"pointer",fontSize:15,fontWeight:600,marginBottom:20,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
                📸 Subir foto de comida
              </button>
            )}

            <div style={{fontSize:13,color:"#64748b",marginBottom:10}}>Comidas registradas ({todayMeals.length})</div>
            {todayMeals.length===0&&<div style={{textAlign:"center",color:"#475569",marginTop:20}}><div style={{fontSize:36}}>🍽️</div><div style={{marginTop:8,fontSize:13}}>Registra tu primera comida</div></div>}
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {todayMeals.map(function(m){
                return(<div key={m.id} style={{background:"#1c1c26",borderRadius:14,padding:"14px 16px",border:"1px solid #2a2a35"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                    <div style={{flex:1,marginRight:10}}>
                      <div style={{fontSize:15,fontWeight:600}}>{m.name}</div>
                      <div style={{fontSize:11,color:"#475569",marginTop:2}}>{m.notes}</div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontSize:16,fontWeight:700,color:"#f59e0b"}}>{m.cals}</span>
                      <span style={{fontSize:10,color:"#64748b"}}>kcal</span>
                      <button onClick={function(){deleteMeal(m.id);}} style={{background:"none",border:"none",cursor:"pointer",color:"#475569",padding:2,display:"flex",alignItems:"center"}}><TrashIcon/></button>
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
                    {[["Proteina",m.protein,C],["Carbos",m.carbs,"#22c55e"],["Grasas",m.fat,"#f43f5e"]].map(function(item){
                      return(<div key={item[0]} style={{background:"#13131a",borderRadius:8,padding:8,textAlign:"center"}}>
                        <div style={{fontSize:14,fontWeight:700,color:item[2]}}>{item[1]}g</div>
                        <div style={{fontSize:10,color:"#475569"}}>{item[0]}</div>
                      </div>);
                    })}
                  </div>
                  <div style={{fontSize:10,color:"#3f3f55",marginTop:8,textAlign:"right"}}>{m.time}</div>
                </div>);
              })}
            </div>
          </div>)}

          {nutriTab==="history"&&(<div>
            <div style={{fontSize:13,color:"#64748b",marginBottom:12}}>Ultimos 7 dias</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {last7.map(function(dk){
                const dayMeals=meals[dk]||[];
                const dt=dayMeals.reduce(function(a,m){return{cals:a.cals+m.cals,protein:a.protein+m.protein};},{cals:0,protein:0});
                const label=new Date(dk+"T12:00:00").toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"});
                const isToday=dk===todayKey;
                const calPct=Math.min(100,Math.round((dt.cals/goals.cals)*100));
                return(<div key={dk} style={{background:isToday?C+"11":"#1c1c26",borderRadius:12,padding:"14px 16px",border:"1px solid "+(isToday?C+"44":"#2a2a35")}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:dayMeals.length>0?10:0}}>
                    <div>
                      <span style={{fontSize:13,fontWeight:600,textTransform:"capitalize",color:isToday?C:"#e2e8f0"}}>{label}{isToday?" (hoy)":""}</span>
                      <span style={{marginLeft:8,fontSize:11,color:"#475569"}}>{dayMeals.length} comida{dayMeals.length!==1?"s":""}</span>
                    </div>
                    {dayMeals.length>0&&<span style={{fontSize:14,fontWeight:700,color:"#f59e0b"}}>{Math.round(dt.cals)} kcal</span>}
                  </div>
                  {dayMeals.length>0&&(<div>
                    <div style={{height:5,background:"#2a2a35",borderRadius:99,marginBottom:6}}><div style={{height:"100%",borderRadius:99,background:calPct>=100?"#22c55e":C,width:calPct+"%"}}/></div>
                    <div style={{fontSize:11,color:"#475569"}}>Proteina: <span style={{color:C,fontWeight:600}}>{Math.round(dt.protein)}g</span></div>
                  </div>)}
                  {dayMeals.length===0&&<div style={{fontSize:12,color:"#3f3f55"}}>Sin registro</div>}
                </div>);
              })}
            </div>
          </div>)}
        </div>)}

        {view==="settings"&&(<div>
          <div style={{fontSize:17,fontWeight:700,marginBottom:20,color:"#fff"}}>Configuracion</div>
          <div style={{background:"#18181f",borderRadius:16,padding:20,border:"1px solid #2a2a35",marginBottom:16}}>
            <div style={{fontSize:14,fontWeight:600,color:C,marginBottom:16}}>Color principal</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:10}}>
              {THEMES.map(function(t,i){
                const isActive=i===themeIdx;
                return(<button key={t.name} onClick={function(){setThemeIdx(i);}} title={t.name} style={{width:38,height:38,borderRadius:"50%",background:t.main,border:isActive?"3px solid #fff":"3px solid transparent",cursor:"pointer",boxShadow:isActive?"0 0 0 2px "+t.main:"none",transition:"all 0.2s",display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {isActive&&<svg width="14" height="14" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                </button>);
              })}
            </div>
            <div style={{marginTop:12,fontSize:12,color:"#64748b"}}>Seleccionado: <span style={{color:C,fontWeight:600}}>{theme.name}</span></div>
          </div>
          <div style={{background:"#18181f",borderRadius:16,padding:20,border:"1px solid #2a2a35",marginBottom:16}}>
            <div style={{fontSize:14,fontWeight:600,color:C,marginBottom:16}}>Metas de nutricion diaria</div>
            {[["cals","Calorias","kcal"],["protein","Proteina","g"],["carbs","Carbohidratos","g"],["fat","Grasas","g"]].map(function(item){
              return(<div key={item[0]} style={{marginBottom:16}}>
                <label style={{fontSize:12,color:"#64748b",display:"block",marginBottom:6}}>{item[1]} <span style={{color:"#475569"}}>({item[2]})</span></label>
                <input type="number" value={goalsForm[item[0]]} onChange={function(e){const val=+e.target.value;setGoalsForm(function(f){const n=Object.assign({},f);n[item[0]]=val;return n;});}} style={{width:"100%",background:"#0f0f13",border:"1px solid #2a2a35",borderRadius:10,padding:"11px 14px",color:"#e2e8f0",fontSize:15,outline:"none",boxSizing:"border-box"}}/>
              </div>);
            })}
            <button onClick={saveGoals} style={{width:"100%",padding:"13px 0",borderRadius:12,border:"none",background:"linear-gradient(135deg,"+CD+","+C+")",color:"#fff",cursor:"pointer",fontSize:15,fontWeight:600}}>Guardar metas</button>
          </div>
          <button onClick={function(){setView("day");}} style={{width:"100%",padding:"12px 0",borderRadius:12,border:"1px solid #2a2a35",background:"transparent",color:"#64748b",cursor:"pointer",fontSize:14}}>Volver</button>
        </div>)}

        {view==="add"&&(<div style={{background:"#1c1c26",borderRadius:16,padding:24,border:"1px solid #2a2a35"}}>
          <div style={{fontSize:17,fontWeight:700,marginBottom:24,color:"#fff"}}>{editId?"Editar actividad":"Nueva actividad"}</div>
          <div style={{marginBottom:16}}>
            <label style={{fontSize:12,color:"#64748b",display:"block",marginBottom:6}}>NOMBRE</label>
            <input value={form.name} onChange={function(e){setForm(function(f){return Object.assign({},f,{name:e.target.value});});}} placeholder="Ej. Ejercicio, Leer..." style={{width:"100%",background:"#0f0f13",border:"1px solid #2a2a35",borderRadius:10,padding:"12px 14px",color:"#e2e8f0",fontSize:15,outline:"none",boxSizing:"border-box"}}/>
          </div>
          <div style={{marginBottom:16}}>
            <label style={{fontSize:12,color:"#64748b",display:"block",marginBottom:6}}>BLOQUE DEL DIA</label>
            <div style={{display:"flex",gap:8}}>
              {BLOCKS.map(function(b){
                const bc=blockColor(b);
                return(<button key={b} onClick={function(){setForm(function(f){return Object.assign({},f,{block:b});});}} style={{flex:1,padding:"10px 0",borderRadius:10,border:"2px solid "+(form.block===b?bc:"#2a2a35"),background:form.block===b?bc+"22":"transparent",color:form.block===b?bc:"#64748b",cursor:"pointer",fontSize:13,fontWeight:form.block===b?600:400,transition:"all 0.2s"}}>{b}</button>);
              })}
            </div>
          </div>
          <div style={{marginBottom:28}}>
            <label style={{fontSize:12,color:"#64748b",display:"block",marginBottom:6}}>VECES POR SEMANA: <span style={{color:C,fontWeight:700}}>{form.freq}x</span></label>
            <input type="range" min={1} max={7} value={form.freq} onChange={function(e){setForm(function(f){return Object.assign({},f,{freq:+e.target.value});});}} style={{width:"100%",accentColor:C}}/>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#3f3f55",marginTop:4}}><span>1x</span><span>7x</span></div>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={function(){setView("day");setEditId(null);setForm({name:"",block:"Mañana",freq:5});}} style={{flex:1,padding:"13px 0",borderRadius:12,border:"1px solid #2a2a35",background:"transparent",color:"#64748b",cursor:"pointer",fontSize:15}}>Cancelar</button>
            <button onClick={saveActivity} style={{flex:2,padding:"13px 0",borderRadius:12,border:"none",background:"linear-gradient(135deg,"+CD+","+C+")",color:"#fff",cursor:"pointer",fontSize:15,fontWeight:600}}>{editId?"Guardar cambios":"Agregar"}</button>
          </div>
        </div>)}
      </div>

      {view!=="add"&&view!=="nutri"&&view!=="settings"&&(
        <button onClick={function(){setEditId(null);setForm({name:"",block:"Mañana",freq:5});setView("add");}} style={{position:"fixed",bottom:"calc(env(safe-area-inset-bottom, 16px) + 16px)",right:"50%",transform:"translateX(50%)",width:56,height:56,borderRadius:"50%",border:"none",background:"linear-gradient(135deg,"+CD+","+C+")",color:"#fff",fontSize:26,cursor:"pointer",boxShadow:"0 4px 24px "+C+"66",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
